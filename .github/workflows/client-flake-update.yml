# Runs every Sunday and opens a PR if client flake inputs have updates.
name: "Client flake update"
on:
  schedule:
    - cron: "0 8 * * 0"  # 08:00 UTC every Sunday
  workflow_dispatch: {}   # Allow manual run

jobs:
  update:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"   # push branch + create PR
      pull-requests: "write"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "DeterminateSystems/determinate-nix-action@v3"
      - uses: "DeterminateSystems/update-flake-lock@main"
        with:
          pr-title: "chore(flake): flake lock update"
          commit-msg: "flake: flake.lock update"
