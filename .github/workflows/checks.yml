name: "Checks"

on:
  pull_request: {}
  push:
    branches:
      - "main"
      - "new-version"

jobs:
  checks:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "DeterminateSystems/determinate-nix-action@v3"
      - uses: "DeterminateSystems/flakehub-cache-action@v3"
        with:
          flakehub-flake-name: "QF0xB/qnix-client"
      - name: "Run checks"
        run: "nix flake check --no-build --keep-going --print-build-logs"
