name: "Build QPCv1"

on:
  pull_request: { }
  push:
    branches:
      - "main"
      - "new-version"

jobs:
  build:
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "DeterminateSystems/determinate-nix-action@v3"
      - uses: "DeterminateSystems/flakehub-cache-action@v3"
        with:
          flakehub-flake-name: "QF0xB/qnix-client"
      - name: "Build QPCv1"
        run: >-
          nix build --no-link --keep-going --print-build-logs
          .#nixosConfigurations.QPCv1.config.system.build.toplevel
